# Clean, fully observable simulation: small noise and no detection errors. The engineering
# targets (position RMSE < 0.15 m, yaw RMSE < 3 deg) refer to this profile.
name: clean
min_range: 0.3
max_range: 8.0
image_margin_px: 4
min_circle_visible_fraction: 0.35
occlusion: true
line_point_spacing: 0.10
max_line_points: 60
line_point_dropout_prob: 0.0
false_line_point_fraction: 0.0
range_std_base: 0.01
range_std_quadratic: 0.005
bearing_std_deg: 0.5
pitch_jitter_std_deg: 0.0
landmark_dropout_prob: 0.0
frame_dropout_prob: 0.0
false_landmark_rate: 0.0
landmark_outlier_prob: 0.0
class_confusion_prob: 0.0
