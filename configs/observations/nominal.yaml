# Oracle perception: how simulator geometry is degraded into "detections". The values are
# engineering guesses for a head-mounted stereo camera, NOT measurements of a real detector.
# Re-fit them once real perception output can be compared against ground truth.
name: nominal

# --- visibility ---
min_range: 0.3                    # metres on the ground from the robot; nearer points are ignored
max_range: 8.0                    # metres; farther features are assumed undetectable
image_margin_px: 4                # features this close to the image border are not detected
min_circle_visible_fraction: 0.35 # share of the centre circle in view needed to report its centre
occlusion: true                   # goal posts and the ball hide what is behind them

# --- field-line points ---
line_point_spacing: 0.10          # metres between candidate points along the lines
max_line_points: 60               # points reported per frame (random subset of the visible ones)
line_point_dropout_prob: 0.10
false_line_point_fraction: 0.05   # spurious points, as a fraction of the reported true points

# --- measurement noise (polar, in the robot frame) ---
range_std_base: 0.02              # metres
range_std_quadratic: 0.01         # 1/m; range std = base + quadratic * range^2
bearing_std_deg: 1.0
pitch_jitter_std_deg: 0.25        # per-frame camera pitch error; shifts every range in the frame together

# --- detection errors ---
landmark_dropout_prob: 0.10       # a visible landmark is missed
frame_dropout_prob: 0.0           # the whole frame is lost
false_landmark_rate: 0.05         # mean number of spurious landmarks per frame (Poisson)
landmark_outlier_prob: 0.02       # a real landmark is reported at a grossly wrong position
class_confusion_prob: 0.02        # an L / T / X junction is reported as another junction class
