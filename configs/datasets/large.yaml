# Larger training preset: 13 000 frames at 640x360, roughly 0.8 GB and 35 minutes to generate.
# Not generated by default and not behind any number in the docs; use it when the baseline
# detector is clearly data-limited. Raise `resolution` to [1280, 720] only if you also train at
# a larger image size: the dataset then takes about four times the disk space.
name: large
version: "1"
seed: 4052
field: s_field
camera: zed_mini_sim
scene: default
resolution: [640, 360]
randomization: strong
splits:
  train: {scenarios: 500, frames_per_scenario: 20}
  val:   {scenarios: 50, frames_per_scenario: 20}
  test:  {scenarios: 100, frames_per_scenario: 20}
image_format: jpg
jpeg_quality: 95
