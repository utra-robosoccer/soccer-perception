# Strong visual randomization: deliberately wider than any single real venue, to push a model
# toward features that survive the jump to a real camera. Expect lower scores on synthetic test
# data than with `mild`; whether it transfers better can only be measured with real footage.
# Ranges are [low, high], sampled uniformly, unless a comment says otherwise.
name: strong
camera:
  height_std: 0.10                # metres around the camera config's mount height (0.90 m)
  height_limits: [0.60, 1.30]
  pitch_std_deg: 9.0              # degrees around the mount pitch (25 deg down)
  pitch_limits_deg: [2.0, 55.0]
  roll_std_deg: 3.0
  roll_limit_deg: 8.0
  pan_range_deg: [-60.0, 60.0]
scene:
  enabled: true
  turf:
    hue: [0.22, 0.42]
    saturation: [0.35, 0.90]
    value: [0.18, 0.60]
    stripe_contrast: [1.0, 1.45]
    stripe_width_choices: [0.0, 0.5, 1.0, 1.5, 2.0]
    noise: [0.04, 0.25]
    blotch: [0.0, 0.20]
  lines:
    brightness: [0.72, 1.0]
    tint: 0.05
  lighting:
    ambient: [0.20, 0.60]
    key_diffuse: [0.20, 0.80]
    key_elevation_deg: [25.0, 88.0]
    fill_diffuse: [0.0, 0.35]
    tint: 0.08
    shadow_prob: 0.7
  surround:
    brightness: [0.10, 0.70]
    tint: 0.10
  sky:
    brightness: [0.25, 1.0]
    tint: 0.12
  background:
    wall_prob: 0.6
    wall_distance: [0.8, 6.0]
    wall_height: [0.5, 4.0]
    clutter_count: [0, 6]
    distractor_prob: 0.35
  goal:
    brightness: [0.78, 1.0]
    tint: 0.05
    net_alpha: [0.05, 0.40]
  ball:
    styles: {checker: 0.35, spots: 0.45, flat: 0.20}
    radius: [0.060, 0.110]        # FIFA size 1 up to size 5
    light_brightness: [0.75, 1.0]
    dark_value: [0.03, 0.45]
    colored_prob: 0.45
  robots:
    height: [0.45, 1.40]
    build: [0.8, 1.3]
    grey: [0.04, 0.92]
    tint: 0.08
    colorful_prob: 0.25
image:
  enabled: true
  exposure_gain: [0.65, 1.40]
  gamma: [0.75, 1.30]
  white_balance: 0.12
  saturation: [0.65, 1.30]
  vignette: [0.0, 0.30]
  defocus_sigma: [0.0, 1.0]
  motion_blur_prob: 0.25
  motion_blur_px: [3, 7]
  noise_std: [0.0, 8.0]
  jpeg_prob: 0.5
  jpeg_quality: [40, 95]
