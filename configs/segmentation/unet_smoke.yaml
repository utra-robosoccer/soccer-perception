# Smoke test of the segmentation training loop: 3 epochs on the 64-frame smoke dataset.
# Proves that training, checkpointing and loading work. NOT a usable model.
name: unet_smoke
dataset: outputs/datasets/smoke
output: outputs/segmentation
model:
  architecture: small_unet
  num_classes: 3
  base_channels: 8
  depth: 3
epochs: 3
patience: 5
monitor: line_iou
batch: 4
workers: 0
device: auto
amp: false
seed: 0
learning_rate: 0.003
class_weights: auto
dice_weight: 0.5
augment:
  crop_size: [320, 256]
  scale_range: [0.9, 1.1]
  flip_prob: 0.5
