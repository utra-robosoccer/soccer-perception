# SYNTHETIC body motion. Plausible for a 70 cm humanoid; NOT fitted to measurements of
# humanoid_prototype_1 (see simulation/body_motion.py). Angles in degrees, lengths in metres
# (one-sided amplitudes), frequencies in hertz.
name: walking_disturbed
description: "The walking profile with abrupt disturbances on top."
step_frequency_hz: 2.2
gait_roll_deg: 2.5
gait_pitch_deg: 1.5
gait_yaw_deg: 2.0
gait_lateral_m: 0.020
gait_vertical_m: 0.008
gait_surge_m: 0.006
gait_lean_pitch_deg: 2.0
sway_pitch_deg: 0.35
sway_pitch_hz: 0.30
sway_roll_deg: 0.25
sway_roll_hz: 0.23
noise_roll_deg: 0.30
noise_pitch_deg: 0.30
noise_height_m: 0.001
noise_bandwidth_hz: 4.0
disturbance_rate_hz: 0.25
disturbance_deg: [4.0, 8.0]
