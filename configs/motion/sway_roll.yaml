# SYNTHETIC body motion. Plausible for a 70 cm humanoid; NOT fitted to measurements of
# humanoid_prototype_1 (see simulation/body_motion.py). Angles in degrees, lengths in metres
# (one-sided amplitudes), frequencies in hertz.
name: sway_roll
description: "Lateral sway about the ankles: the camera roll varies by +-4 deg."
sway_pitch_deg: 0.35
sway_pitch_hz: 0.30
sway_roll_deg: 4.0
sway_roll_hz: 0.45
noise_roll_deg: 0.12
noise_pitch_deg: 0.15
noise_height_m: 0.0005
noise_bandwidth_hz: 1.5
